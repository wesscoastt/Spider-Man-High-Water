<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F13">
<title>Spider-Man: High Water</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0F13'/%3E%3Cpath d='M6 22h20M16 8v18M8 12l16 8M24 12L8 20' stroke='%23F0763C' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/dialogue.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/cinema.css">
<link rel="stylesheet" href="css/examine.css">
<link rel="stylesheet" href="css/touch.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<canvas id="viewport"></canvas>

<!-- ============ BOOT / LOADING ============ -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-eyebrow">PHASE 2–4 PROTOTYPE</div>
    <h1>SPIDER&#8209;MAN<span>HIGH WATER</span></h1>
    <p class="boot-tag">The water always finds the low ground.</p>
    <div class="boot-bar"><div id="bootFill"></div></div>
    <div id="bootMsg" class="boot-msg">Warming up the engine&hellip;</div>
    <button id="bootStart" hidden>CONTINUE</button>
    <div class="boot-note">Click to capture the mouse. <kbd>Esc</kbd> releases it.</div>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" hidden>
  <div id="hudDistrict">
    <span class="dcode">D-03</span>
    <span class="dname">SUGARHILL</span>
    <span class="dsub" id="hudClock">6:42 PM &middot; 101&deg;F</span>
  </div>

  <div id="hudMode">
    <span class="modelabel" id="modeLabel">PETER</span>
    <span class="modehint" id="modeHint">F &mdash; put on the mask</span>
  </div>

  <div id="hudWebs" hidden>
    <span class="weblabel">WEB FLUID</span>
    <div class="webcells" id="webCells"></div>
  </div>

  <div id="crosshair"><span class="ch-dot"></span><span class="ch-ring" id="chRing"></span></div>

  <div id="hudControls">
    <div class="ctrl-title">CONTROLS</div>
    <dl id="ctrlList"></dl>
  </div>

  <div id="instinct"></div>
  <div id="toast"></div>

  <div id="objective" hidden>
    <span class="obj-tick"></span>
    <span class="obj-text"></span>
  </div>


  <div id="perf">
    <span id="perfFps">--</span> fps
    <span class="sep">/</span> <span id="perfMs">--</span> ms
    <span class="sep">/</span> <span id="perfDraw">--</span> draws
    <span class="sep">/</span> <span id="perfTri">--</span> tris
  </div>
</div>

<!-- ============ EXAMINE ============ -->
<div id="examine" hidden>
  <div class="ex-card">
    <div class="ex-tag"></div>
    <h2 class="ex-title"></h2>
    <div class="ex-body"></div>
    <div class="ex-foot">
      <span class="ex-count"></span>
      <span class="ex-dismiss"><b>R</b> back</span>
    </div>
  </div>
</div>

<!-- full-screen fade, for travelling between places -->
<div id="fade"></div>

<div id="talkPrompt"><b>R</b><span>TALK TO <span class="who"></span></span></div>
<div id="usePrompt" class="world-prompt"><b>R</b><span class="what"></span></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
